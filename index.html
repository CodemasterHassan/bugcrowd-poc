<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Awareness Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #2c3e50;
      color: #ecf0f1;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 500px;
      margin: 50px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #3498db;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
    .note {
      font-size: 14px;
      color: #e74c3c;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Security Verification Demo</h1>
  </div>

  <div class="container">
    <p class="note"><strong>Note:</strong> This is a secuirty form.  enter real credentials.</p>

    <form action="#" method="POST">
      <label>Email Address</label>
      <input type="email" placeholder="example@email.com" required>

      <label>Full Name</label>
      <input type="text" placeholder="Enter your name" required>

      <label>payment card number</label>
      <input type="text" placeholder="Just for UI practice" required>
      <label>payment card number with CVV</label>
      <input type="text" placeholder="Just for UI practice" required>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
